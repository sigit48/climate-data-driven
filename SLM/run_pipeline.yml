name: Carbon Emission Pipeline

# 🎯 TUJUAN: pipeline berat (Prefect + dbt + Prophet + scikit-learn) dijalankan di
# sini, BUKAN di dalam proses HF Space -- Space jadi jauh lebih ringan (cuma
# dashboard + trigger), dan tidak lagi bergantung pada kuota CPU Basic HF yang
# sekarang dibatasi untuk akun gratis.
#
# CARA TRIGGER:
#   1. Otomatis terjadwal setiap hari jam 03:00 UTC (~10:00 WIB)
#   2. Manual: tab "Actions" di repo GitHub -> pilih workflow ini -> "Run workflow"
#   3. Dari tombol di Streamlit Space (lewat GitHub API, lihat app.py)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: python pipeline-prefect.py
